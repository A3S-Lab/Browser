name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "a3s-use-browser"))')
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo package --locked -p a3s-use-browser

  dashboard:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/browser-driver/dashboard/pnpm-lock.yaml
      - run: pnpm --dir crates/browser-driver/dashboard install --frozen-lockfile
      - run: pnpm --dir crates/browser-driver/dashboard build
      - run: test -f crates/browser-driver/dashboard/out/index.html

  binaries:
    needs: [validate, dashboard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: darwin-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target "${{ matrix.target }}" -p a3s-use-browser-driver
      - name: Package Unix driver and assets
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="a3s-browser-${{ needs.validate.outputs.version }}-${{ matrix.name }}.tar.gz"
          stage="${RUNNER_TEMP}/a3s-browser-${{ matrix.name }}"
          install -d "${stage}/skills" "${stage}/skill-data" "${stage}/dashboard"
          install -m 0755 \
            "target/${{ matrix.target }}/release/a3s-use-browser-driver" \
            "${stage}/a3s-use-browser-driver"
          cp -R crates/browser-driver/skills/. "${stage}/skills/"
          cp -R crates/browser-driver/skill-data/. "${stage}/skill-data/"
          cp -R crates/browser-driver/dashboard/out/. "${stage}/dashboard/"
          cp LICENSE README.md THIRD_PARTY_NOTICES.md "${stage}/"
          cp crates/browser-driver/LICENSE-APACHE-2.0 "${stage}/"
          cp crates/browser-driver/UPSTREAM.md "${stage}/"
          tar czf "${archive}" -C "${stage}" .
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"
      - name: Package Windows driver and assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "a3s-browser-${{ needs.validate.outputs.version }}-${{ matrix.name }}.zip"
          $stage = Join-Path $env:RUNNER_TEMP "a3s-browser-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "$stage/skills", "$stage/skill-data", "$stage/dashboard" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/a3s-use-browser-driver.exe" $stage
          Copy-Item -Recurse "crates/browser-driver/skills/*" "$stage/skills"
          Copy-Item -Recurse "crates/browser-driver/skill-data/*" "$stage/skill-data"
          Copy-Item -Recurse "crates/browser-driver/dashboard/out/*" "$stage/dashboard"
          Copy-Item LICENSE,README.md,THIRD_PARTY_NOTICES.md $stage
          Copy-Item crates/browser-driver/LICENSE-APACHE-2.0 $stage
          Copy-Item crates/browser-driver/UPSTREAM.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify packaged assets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARCHIVE}"
          test -f "${ARCHIVE}"
      - uses: actions/upload-artifact@v4
        with:
          name: a3s-browser-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  publish-crate:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked -p a3s-use-browser
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: [validate, binaries, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
