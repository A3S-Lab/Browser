[package]
name = "a3s-use-browser"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/A3S-Lab/Browser"
homepage = "https://github.com/A3S-Lab/Browser"
authors = ["A3S Lab"]
rust-version = "1.82"
description = "Provider-oriented browser rendering and session contracts for A3S"
readme = "README.md"
keywords = ["browser", "automation", "chrome", "a3s"]
categories = ["web-programming", "api-bindings"]

[features]
default = ["chrome"]
chrome = [
    "dep:chromiumoxide",
    "dep:fs2",
    "dep:futures",
    "dep:reqwest",
    "dep:tracing",
    "dep:which",
    "dep:zip",
]
lightpanda = ["chrome"]

[dependencies]
a3s-use-core = "0.2.0"
async-trait = "0.1"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], optional = true }
fs2 = { version = "0.4", optional = true }
futures = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "process", "sync", "time"] }
tracing = { version = "0.1", optional = true }
url = { version = "2", features = ["serde"] }
which = { version = "7", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "process", "sync", "time"] }
